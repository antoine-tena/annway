name: CI

# The reusable workflows live in kiln (antoine-tena/kiln, public), cited at the kiln release the
# project comes from (v0.4.0): `kiln update` moves them to the next one. The project only
# keeps its parameters here.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Replayed by deploy.yml before any production release.
  workflow_call:

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/maven.yml@v0.4.0
    with:
      directory: backend

  charter:
    uses: antoine-tena/kiln/.github/workflows/charter.yml@v0.4.0

  # [SECRETS]: gitleaks searches the whole history, with no organisation licence.
  secrets-scan:
    uses: antoine-tena/kiln/.github/workflows/secrets.yml@v0.4.0

name: CI

# Les workflows réutilisables vivent dans kiln (antoine-tena/kiln, public) : ils évoluent pour
# tous les projets à la fois. Le projet ne garde ici que ses paramètres.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Rejouée par deploy.yml avant toute mise en production.
  workflow_call:

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/maven.yml@develop
    with:
      dossier: backend

  charte:
    uses: antoine-tena/kiln/.github/workflows/charte.yml@develop

  secrets-scan:
    runs-on: ubuntu-latest
    # Sur une PR, gitleaks lit la liste de ses commits par l'API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # [SECRETS] : tout l'historique est fouillé, pas seulement le dernier commit.
      - name: Rechercher des secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

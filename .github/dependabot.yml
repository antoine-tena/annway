# Veille des dépendances : une PR groupée par semaine. `kiln update` ne monte pas les versions
# du pom.xml : Dependabot les propose ici.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

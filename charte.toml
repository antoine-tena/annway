# Règles impératives de CLAUDE.md vérifiées par la commande `charte` (installée avec kiln) :
# après chaque édition (hook Claude), avant chaque commit (pre-commit) et en CI.
# Interdictions : respectées partout. Cliquets : le passif est un plafond qui ne fait que
# baisser. Planchers : une valeur qui ne fait que monter. Valeurs : `charte --detail`.

exclus = ["/migrations/", "/notebooks/"]
regles_non_verifiees = "scripts/ci/charte-non-verifiee.txt"

[interdictions.outils-interdits]
id = "UV-PODMAN"

# Les renvois à un rapport d'audit (« audit H36 », « (CART-06) ») pourrissent avec lui. Ajouter
# à `prefixes` les préfixes des constats des audits du projet, à mesure qu'ils arrivent.
[interdictions.renvois-audit]
id = "RENVOIS-AUDIT"
prefixes = "AUDIT"
exclus = '(^docs/|^charte\.toml$|/migrations/|-lock\.yaml$|\.lock$)'

[cliquets.taille-fichier]
id = "TAILLE-FICHIER"
fichiers = ["backend/src/**/*.java"]
suffixes = [".py", ".java", ".ts", ".tsx", ".vue", ".astro", ".css", ".mjs"]
budget = 0

# Java : le logger du JDK, jamais la console ni la trace brute ; l'horloge est injectée.
[cliquets.journalisation-console]
regle = "occurrences"
id = "JOURNALISATION"
fichiers = ["backend/src/main/**/*.java"]
motif = "System.out.print"
budget = 0

[cliquets.journalisation-erreurs]
regle = "occurrences"
id = "JOURNALISATION"
fichiers = ["backend/src/main/**/*.java"]
motif = "System.err.print"
budget = 0

[cliquets.journalisation-trace]
regle = "occurrences"
id = "JOURNALISATION"
fichiers = ["backend/src/**/*.java"]
motif = "printStackTrace("
budget = 0

[cliquets.horloge-instant]
regle = "occurrences"
id = "HORLOGE"
fichiers = ["backend/src/**/*.java"]
motif = "Instant.now()"
budget = 0

[cliquets.horloge-date]
regle = "occurrences"
id = "HORLOGE"
fichiers = ["backend/src/**/*.java"]
motif = "LocalDate.now()"
budget = 0

[cliquets.temps-constant-java]
regle = "occurrences"
id = "TEMPS-CONSTANT"
fichiers = ["backend/src/main/**/*.java"]
motif = "Token.equals("
budget = 0

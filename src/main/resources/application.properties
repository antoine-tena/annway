spring.application.name=annway

# [SANTE] : sondes de vivacité et de disponibilité distinctes (/actuator/health/liveness,
# /actuator/health/readiness) ; seul health est exposé, sans détail.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Arrêt propre : les requêtes en cours se terminent avant l'extinction.
server.shutdown=graceful
